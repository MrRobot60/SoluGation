<!doctype html>
<html lang="fr">
<body style="margin:0;padding:24px;background:#eeeff3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;color:#1d1d1f">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto">
    <tr><td style="padding:0 4px 16px">
      <img src="{{ logo }}" width="36" height="36" alt="SoluGation" style="border-radius:8px;vertical-align:middle">
      <span style="font-size:17px;font-weight:700;vertical-align:middle;margin-left:8px">SoluGation</span>
    </td></tr>
    <tr><td style="background:#ffffff;border-radius:20px;padding:24px">
      <h1 style="margin:0 0 12px;font-size:20px;line-height:1.3">{{ titre }}</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.5;white-space:pre-line">{{ message }}</p>
      {% if lien %}<a href="{{ lien }}" style="display:inline-block;background:#193a4e;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:999px">{{ bouton }}</a>
      <p style="margin:16px 0 0;font-size:12px;color:#636366;word-break:break-all">Ou copiez cette adresse : {{ lien }}</p>{% endif %}
      {% if note %}<p style="margin:20px 0 0;font-size:13px;color:#636366">{{ note }}</p>{% endif %}
    </td></tr>
    <tr><td style="padding:16px 4px 0;font-size:12px;color:#636366">
      Message automatique de SoluGation concernant votre compte.
    </td></tr>
  </table>
</body>
</html>
