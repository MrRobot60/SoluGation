# SoluGation en production : docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Seul le proxy (Caddy) est exposé ; base, stockage et serveur restent sur le réseau interne.
name: solugation-prod

x-application: &application
  build: ./backend
  image: solugation-backend:prod
  env_file: .env.production
  environment:
    DJANGO_DEBUG: "False"
    # Construite ici : le mot de passe n'est saisi qu'une fois (POSTGRES_PASSWORD).
    DATABASE_URL: postgres://${POSTGRES_USER:-solugation}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-solugation}
    IA_EXECUTION: taches
    SOLUGATION_PROXY_DE_CONFIANCE: "True"
    SOLUGATION_DATA_DIR: /data
  volumes:
    - ./data:/data
    - ./sauvegardes:/sauvegardes
  restart: unless-stopped
  logging: &journaux
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  proxy:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: solugation-interface:prod
    environment:
      SOLUGATION_DOMAINE: ${SOLUGATION_DOMAINE:?SOLUGATION_DOMAINE manquant dans .env.production}
      SOLUGATION_ENVOI_MAX_MO: ${SOLUGATION_ENVOI_MAX_MO:-60}
    ports:
      - "${SOLUGATION_PORT_HTTP:-80}:80"
      - "${SOLUGATION_PORT_HTTPS:-443}:443"
      - "${SOLUGATION_PORT_HTTPS:-443}:443/udp"
    volumes:
      - caddy_data:/data  # certificats TLS : à conserver
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *journaux

  backend:
    <<: *application
    command: ["sh", "demarrer.sh", "web"]
    depends_on:
      postgres:
        condition: service_healthy
      stockage:
        condition: service_healthy
        required: false  # absent si le stockage est un S3 externe

  # Analyses IA en attente et rappels planifiés (réunions, revues, dérogations) : pas de cron à installer.
  taches:
    <<: *application
    command: ["sh", "demarrer.sh", "taches"]
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-solugation}
      POSTGRES_USER: ${POSTGRES_USER:-solugation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *journaux

  # Stockage S3 intégré (SeaweedFS). Pour un S3 externe (Scaleway, OVHcloud…) : retirer « stockage-local »
  # de COMPOSE_PROFILES et renseigner S3_ENDPOINT_URL et les clés de l'hébergeur.
  stockage:
    image: chrislusf/seaweedfs:4.48
    profiles: ["stockage-local"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"solugation","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - stockage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *journaux

volumes:
  postgres_data:
  stockage_data:
  caddy_data:
  caddy_config:
